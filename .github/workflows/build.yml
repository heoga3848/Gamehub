name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir proyecto
        run: unzip -q GameHub-AndroidStudio.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar
        working-directory: GameHub
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1 || {
            echo "===== ERRORES ====="
            grep -E "^e: |What went wrong|Could not|Execution failed" -A4 build.log | head -60
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: GameHub-apk
          path: GameHub/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GameHub build ${{ github.run_number }}
          files: GameHub/app/build/outputs/apk/debug/app-debug.apk
